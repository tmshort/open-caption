<html lang="en" data-floor="modern">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/shared/compat.css">
<script src="/static/shared/compat.js"></script>
<script src="/static/shared/i18n.js"></script>
<link rel="icon" type="image/svg+xml" href="/static/shared/favicon.svg">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/static/shared/apple-touch-icon.png">
<title>Setup</title>
<link rel="stylesheet" href="/static/shared/ui.css">
<link rel="stylesheet" href="/static/shared/header.css">
<link rel="stylesheet" href="/static/shared/report.css">
<link rel="stylesheet" href="/static/admin/admin.css">
</head>
<body>
<main id="login" hidden><form>
  <h1>Open Caption — Setup</h1>
  <p data-t>Enter the <strong>admin</strong> password. It was printed in the console the first time the server started, and it is in <code>config.yaml</code>.</p>
  <label>Admin password <input id="pw" type="password" name="password" autocomplete="current-password" required></label>
  <button class="primary">Sign in</button>
  <p id="loginerr" role="alert"></p>
</form></main>

<div id="app" hidden>
  <header>
    <h1>Open Caption <span>Setup</span></h1>
    <span id="working" class="pill" title="The show you are working on"></span>
    <span id="live" class="pill live" hidden></span>
    <div class="rhs">
    <button id="viewers" class="pill" title="Show which devices are connected">👥 0</button>
    <button id="settingsbtn" class="quiet">Settings</button>
    <a class="quiet" href="/operator" title="Open the Run page">Run</a>
    <button id="helpbtn" class="quiet" title="Help (F1)">Help</button>
    <button id="logout" class="quiet">Sign out</button>
    <i id="dot" title="Connection"></i>
    </div>
  </header>
  <div id="connbar" class="connbar" role="alert" hidden>Connection to the program lost. Reconnecting…</div>
  <nav id="steps" aria-label="Setup steps"></nav>
  <main id="panel"></main>
  <div id="nextstep" class="nextstep" hidden></div>
</div>

<aside id="help" hidden aria-label="Help">
  <div class="bar"><b>Help</b><button id="helpclose">Close</button></div>
  <iframe title="Help topics" src="about:blank"></iframe>
</aside>

<dialog id="dlg">
  <form method="dialog">
    <h2 id="dlgtitle"></h2>
    <div id="dlgbody"></div>
    <menu>
      <button type="button" id="dlgcancel">Cancel</button>
      <button type="button" id="dlgextra" hidden></button>
      <button value="ok" id="dlgok" class="primary">OK</button>
    </menu>
  </form>
</dialog>
<div id="toast" role="status"></div>
<script src="/static/shared/speakers.js"></script>
<script src="/static/shared/clients.js"></script>
<script src="/static/shared/report.js"></script>
<script src="/static/admin/admin.js"></script>
</body>
</html>
