<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<link rel="icon" type="image/svg+xml" href="/static/shared/favicon.svg">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/static/shared/apple-touch-icon.png">
<title>Captions</title>
<link rel="stylesheet" href="/static/audience/audience.css">
</head>
<body class="mode-idle">
<main id="captions" role="log" aria-live="polite" aria-label="Captions" tabindex="0"></main>
<button id="live" type="button" hidden>↓ Back to live</button>
<div id="idle" aria-live="polite"></div>
<div id="fs" hidden></div>
<div id="offline" role="status" hidden>Reconnecting…</div>
<i id="dot" aria-hidden="true"></i>
<div id="tip" role="note" hidden>Tip: turn off Auto-Lock in your device settings so the screen stays on during the show.</div>
<button id="langbtn" type="button" aria-label="Language" aria-expanded="false" hidden>🌐</button>
<div id="langmenu" role="menu" aria-label="Language" hidden></div>
<button id="gear" type="button" aria-label="Text size and colors" aria-expanded="false">Aa</button>
<div id="ctl" role="group" aria-label="Your display" hidden>
  <button type="button" id="smaller" aria-label="Smaller text">A−</button>
  <button type="button" id="bigger" aria-label="Larger text">A+</button>
  <select id="fontsel" aria-label="Font">
    <option value="">Font: as chosen</option>
    <option value="dyslexic">Dyslexia-friendly font</option>
    <option value="hyperlegible">High-legibility font</option>
  </select>
  <button type="button" id="scheme" aria-pressed="false">Dark on light</button>
</div>
<script src="/static/shared/speakers.js"></script>
<script src="/static/audience/audience.js"></script>
</body>
</html>
